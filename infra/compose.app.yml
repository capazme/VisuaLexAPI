# The application modules: the server (with its one-shot migrate step), the ingress, and
# the MCP server (profile "mcp", started when MCP_PUBLIC_URL is set in infra/.env).
#
# One of the files of the production stack; compose.prod.yml wires them together
# (networks, restart, logs). ./start.sh --prod runs:
#
#   docker compose -f infra/compose.yml -f infra/compose.app.yml \
#     -f infra/compose.scrapers.yml -f infra/compose.prod.yml --profile merlt up -d --build
#
# Leave compose.scrapers.yml out to run the scrapers on another machine and point
# SCRAPERS_ADDR (infra/.env) at it: nothing here depends on that service existing.
#
# compose.prod.yml must be the LAST file: it is what puts each module on its network.
# Without it the modules share the default network with the stores. Needs Docker
# Compose 2.24 or newer (the long form of env_file below, `required:`).
#
# Secrets shared with MERL-T (MERLT_INTERNAL_SECRET, MERLT_API_KEY) live in
# infra/.env and nowhere else, so the two sides cannot drift. apps/server/.env keeps
# the server's own (the JWT secret, the admin seed, ...).
# Design: docs/superpowers/specs/2026-09-29-modular-deployment-design.md

x-database: &database
  # Derived here from the stack's own password, not read from apps/server/.env,
  # whose DATABASE_URL points at localhost for the development flow.
  # No default: a production stack must never come up with a password everyone knows.
  DATABASE_URL: "postgresql://visualex:${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD is not set in infra/.env (./start.sh --prod creates it)}@postgres:5432/visualex_platform"

x-hardening: &hardening
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # Applies the Prisma migrations, then exits. `prisma` is a development dependency,
  # which is why this is its own image target and not part of the server's.
  migrate:
    <<: *hardening
    build:
      context: ../apps/server
      target: migrate
    container_name: ${VISUALEX_STACK:-visualex}-migrate
    restart: "no"
    environment:
      <<: *database
    depends_on:
      postgres: {condition: service_healthy}

  server:
    <<: *hardening
    build:
      context: ../apps/server
      target: runtime
    container_name: ${VISUALEX_STACK:-visualex}-server
    # Optional at render time so the files can be checked without secrets; a server
    # started without JWT_SECRET refuses to boot, by name.
    env_file:
      - path: ../apps/server/.env
        required: false
    environment:
      <<: *database
      NODE_ENV: production
      PORT: "3001"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_ENABLED: "true"
      # The browser's address of the app: the CORS allow-list. Comma-separated.
      ALLOWED_ORIGINS: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      # The OAuth authorization server for MCP clients. Its identity is the public origin,
      # exactly as clients see it; the resource is the MCP endpoint as people type it. The
      # MCP's credential lives in infra/.env, shared with the mcp module (below). Without
      # the mcp profile none of this is used.
      OAUTH_ISSUER: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      OAUTH_CONSENT_URL: "${PUBLIC_ORIGIN:-http://localhost:8080}/connect"
      OAUTH_MCP_RESOURCE: "${MCP_PUBLIC_URL:-http://localhost:8091/mcp}"
      OAUTH_MCP_CLIENT_SECRET: "${MCP_CLIENT_SECRET:-}"
      LEGAL_API_URL: "http://${SCRAPERS_ADDR:-scrapers:5000}"
      MERLT_ENABLED: "${MERLT_ENABLED:-true}"
      MERLT_API_URL: "http://merlt-api:8000"
      MERLT_INTERNAL_SECRET: "${MERLT_INTERNAL_SECRET:?MERLT_INTERNAL_SECRET is not set in infra/.env (./start.sh --prod creates it)}"
      MERLT_API_KEY: "${MERLT_API_KEY:-}"
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      # The MERL-T dead-letter log (NDJSON, capped at 50 MB): tracking events.
      - server_logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp

  # The one module that faces the network. The only published port of the stack.
  ingress:
    <<: *hardening
    build:
      context: ..
      dockerfile: infra/ingress/Dockerfile
      # The app's MERL-T switch follows the server's: MERLT_ENABLED=false hides MERL-T in
      # the app too (otherwise every MERL-T call answers 404), unless VITE_FEATURE_MERLT
      # says otherwise. Never an empty string: the app reads "" as false.
      # The graph flag is key only: taken from the environment when set, NOT passed when unset.
      args:
        - VITE_FEATURE_MERLT=${VITE_FEATURE_MERLT:-${MERLT_ENABLED:-true}}
        - VITE_FEATURE_MERLT_GRAPH
    container_name: ${VISUALEX_STACK:-visualex}-ingress
    environment:
      SERVER_UPSTREAM: "server:3001"
      SCRAPERS_UPSTREAM: "${SCRAPERS_ADDR:-scrapers:5000}"
      # The subnets Caddy keeps a forwarded client address from: the same values that
      # compose.prod.yml gives the two networks.
      APP_SUBNET: "${APP_SUBNET:-172.29.240.0/24}"
      EDGE_SUBNET: "${EDGE_SUBNET:-172.29.241.0/24}"
    # Loopback by default; INGRESS_BIND is the home-network address to reach it from
    # other devices. The container listens on 8080 as a normal user.
    ports:
      - "${INGRESS_BIND:-127.0.0.1}:${INGRESS_PORT:-8080}:8080"
    depends_on:
      server: {condition: service_healthy}
    read_only: true
    tmpfs:
      - /tmp

  # The MCP server (profile "mcp": started only when MCP_PUBLIC_URL is set in infra/.env).
  # A second door, on the loopback only: the host's overlay proxy publishes it. It reaches
  # the server and nothing else. Spec: docs/superpowers/specs/2026-10-05-mcp-production-design.md
  mcp:
    <<: *hardening
    profiles: [mcp]
    build:
      context: ../apps/mcp
    container_name: ${VISUALEX_STACK:-visualex}-mcp
    environment:
      NODE_ENV: production
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "3002"
      MCP_RESOURCE: "${MCP_PUBLIC_URL:-http://localhost:8091/mcp}"
      MCP_AUTH_ISSUER: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      MCP_AUTH_URL: "http://server:3001"
      MCP_API_BASE: "http://server:3001/api"
      MCP_API_AUDIENCE: "${PUBLIC_ORIGIN:-http://localhost:8080}/api"
      MCP_CLIENT_SECRET: "${MCP_CLIENT_SECRET:-}"
      MCP_ALLOWED_ORIGINS: ""
    # The loopback only, never a LAN address: a device there could forge its client
    # address past the per-address ceiling. MCP_PORT here is the port on the host.
    ports:
      - "127.0.0.1:${MCP_PORT:-8091}:3002"
    depends_on:
      server: {condition: service_healthy}
    read_only: true
    tmpfs:
      - /tmp

volumes:
  server_logs: {name: "${VISUALEX_STACK:-visualex}_server_logs"}
