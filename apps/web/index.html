<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <!-- The column (D-136): the .ico and the PNG for the browsers that ask for them (Safari, the address /favicon.ico);
       the SVG last, which those that read it prefer. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="LexCraft is an advanced legal research and visualization tool for Italian and European law, transforming complex regulations into interactive knowledge graphs." />
  <meta name="author" content="LexCraft" />
  <meta name="theme-color" content="#f1eee8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1f1e1c" media="(prefers-color-scheme: dark)" />
  <title>LexCraft</title>
  <script src="/theme-boot.js"></script>
  <!-- The splash: LexCraft's column, still, breathes while the app downloads (LC37, Luca: «la colonnina io la terrei fissa»); React replaces #root's content when
       it starts. Same mark as components/ui/BookMark.tsx: capital and base in the text's colour, the shaft in stone,
       the flutes cut out of it so the paper shows through. -->
  <style>
    .vlx-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f1eee8; color: #2b2a28; }
    .vlx-splash svg { width: 56px; height: 56px; animation: vlx-splash-breathe 1.1s ease-in-out infinite alternate; }
    .vlx-splash .vlx-column-shaft { fill: #8a8478; }
    @keyframes vlx-splash-breathe { to { opacity: 0.3; } }
    .dark .vlx-splash { background: #1f1e1c; color: #f1eee8; }
    @media (prefers-reduced-motion: reduce) { .vlx-splash svg { animation: none; } }
  </style>
</head>

<body>
  <div id="root"><div class="vlx-splash" role="status" aria-label="Caricamento di LexCraft"><svg viewBox="0 0 100 100" aria-hidden="true"><g class="vlx-column"><g transform="translate(50,50) scale(1.4930,0.7858)" fill="currentColor"><rect x="-12.90" y="-53.45" width="25.80" height="3.85"/><path d="M-11.87 -49.60 L11.87 -49.60 L6.00 -43.72 L-6.00 -43.72 Z"/><path class="vlx-column-shaft" fill-rule="evenodd" d="M-6.00 -43.72 L6.00 -43.72 L7.50 45.17 L-7.50 45.17 Z M-2.74 -40.72 h1.49 v82.89 h-1.49 Z M1.26 -40.72 h1.49 v82.89 h-1.49 Z"/><rect x="-9.90" y="45.17" width="19.80" height="4.43" rx="2.01"/><rect x="-13.90" y="49.60" width="27.80" height="3.85"/></g></g></svg></div></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
