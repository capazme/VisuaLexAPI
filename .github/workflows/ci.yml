name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  visualex:
    name: Python API (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # requirements-dev.txt pulls requirements.txt.
      - run: pip install -r services/visualex/requirements-dev.txt
      - run: python -m pytest tests/ -q
        working-directory: services/visualex
      - run: python -m pytest tests/ -q
        working-directory: tools/archivio-normativo

  # The web tests run in three shards, each on a runner of its own, and build and
  # lint on a fourth, all at once. "Web build, test, lint" is a check the ruleset
  # on main and develop requires by name: that job waits for the four above and
  # passes only when every one of them passed.
  web-tests:
    name: Web tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to the end, so one shard's failure does not hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm 11 writes the lockfiles; npm 10 (Node 20) rejects them.
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # Vitest sorts the test files by a hash of their path and gives each shard
      # one slice of that list: every file runs once, in exactly one shard.
      - run: npm run test -- --run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  web-build:
    name: Web build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # tsc -b is the real type-check: a bare tsc --noEmit reports a false green.
      - run: npm run build
      - run: npm run lint

  web:
    name: Web build, test, lint
    needs: [web-tests, web-build]
    # Always, so that a failed or cancelled job above turns this check red: a
    # skipped check would count as passed.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # needs.web-tests.result folds the shards into one result, and GitHub has
      # been seen to report success for a shard cancelled before any runner took
      # it. So the run's own list of jobs is asked too: the four jobs above must
      # all be there, each a success. A job renamed or added there turns this red
      # until the count here follows.
      - name: Every web job passed
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '[.jobs[] | select((.name | startswith("Web tests (")) or .name == "Web build and lint") | {name, conclusion}]')
          echo "$jobs" | jq -r '.[] | "\(.name): \(.conclusion)"'
          echo "$jobs" | jq -e 'length == 4 and all(.[]; .conclusion == "success")' > /dev/null
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}

  mcp:
    name: MCP server build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      # Against stub servers: no database, no other service.
      - run: npm test

  server:
    name: Server tests
    runs-on: ubuntu-latest
    # The setup runs `prisma migrate reset` and truncates every table: it needs
    # a real Postgres and a database whose name contains "test".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: visualex
          POSTGRES_PASSWORD: visualex
          POSTGRES_DB: visualex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visualex -d visualex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Wins over apps/server/.env.test: dotenv-cli does not override.
      DATABASE_URL: postgresql://visualex:visualex@localhost:5432/visualex_test
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      # The database is thrown away with the job, so the writes fsync makes durable
      # are not worth waiting for. A service takes no server options, hence ALTER
      # SYSTEM: all three settings take effect on a reload, checked from a new session.
      - name: Postgres without fsync
        run: |
          psql -v ON_ERROR_STOP=1 -d "$DATABASE_URL" \
            -c 'ALTER SYSTEM SET fsync = off' \
            -c 'ALTER SYSTEM SET synchronous_commit = off' \
            -c 'ALTER SYSTEM SET full_page_writes = off' \
            -c 'SELECT pg_reload_conf()'
          for attempt in 1 2 3 4 5; do
            settings=$(psql -d "$DATABASE_URL" -tA -c "SELECT string_agg(name || '=' || setting, ' ' ORDER BY name) FROM pg_settings WHERE name IN ('fsync', 'full_page_writes', 'synchronous_commit')")
            echo "$settings"
            [ "$settings" = 'fsync=off full_page_writes=off synchronous_commit=off' ] && exit 0
            sleep 1
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm run test

  merlt:
    name: MERL-T tests
    runs-on: ubuntu-latest
    # The suite runs against this disposable Postgres. Tests marked
    # `integration` (live FalkorDB) are excluded from that run by pyproject's
    # addopts, and run next against this disposable FalkorDB.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: merlt
          POSTGRES_PASSWORD: merlt
          POSTGRES_DB: merlt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merlt -d merlt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      falkordb:
        # The image infra/compose.yml pins for the development graph. The host
        # port is one no client defaults to (Redis, RQ and the worker use 6379,
        # FalkorDBConfig 6380): only the step that names it reaches the graph.
        image: falkordb/falkordb@sha256:d6aa9598b79cd54935864d56f971f3916156399a9ca38a5fae6c029ab1f2bce9
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli -p 6379 ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENRICHMENT_DATABASE_URL: postgresql+asyncpg://merlt:merlt@localhost:5432/merlt
      RLCF_DATABASE_URL: postgresql://merlt:merlt@localhost:5432/merlt
      RLCF_ASYNC_DATABASE_URL: postgresql+asyncpg://merlt:merlt@localhost:5432/merlt
      DATABASE_URL: postgresql://merlt:merlt@localhost:5432/merlt
    defaults:
      run:
        working-directory: services/merlt
    steps:
      - uses: actions/checkout@v4
        with:
          # test_brocardi_off.py reads the vendored mcp-legal-it's source bindings.
          submodules: true
      # As in "Server tests": a disposable database, written without fsync.
      - name: Postgres without fsync
        run: |
          psql -v ON_ERROR_STOP=1 -d "$DATABASE_URL" \
            -c 'ALTER SYSTEM SET fsync = off' \
            -c 'ALTER SYSTEM SET synchronous_commit = off' \
            -c 'ALTER SYSTEM SET full_page_writes = off' \
            -c 'SELECT pg_reload_conf()'
          for attempt in 1 2 3 4 5; do
            settings=$(psql -d "$DATABASE_URL" -tA -c "SELECT string_agg(name || '=' || setting, ' ' ORDER BY name) FROM pg_settings WHERE name IN ('fsync', 'full_page_writes', 'synchronous_commit')")
            echo "$settings"
            [ "$settings" = 'fsync=off full_page_writes=off synchronous_commit=off' ] && exit 0
            sleep 1
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          # The image is python:3.11-slim (services/merlt/Dockerfile).
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/merlt/pyproject.toml
      # CPU wheels first, as the Dockerfile does.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: |
          python -c "
          import asyncio
          from merlt.storage.enrichment.database import init_db, create_tables
          from merlt.storage.enrichment.schema_additions import ensure_schema_additions
          async def main():
              await init_db()
              await create_tables()
              await ensure_schema_additions()
          asyncio.run(main())
          "
      - run: python -m pytest tests/ -q -p no:cacheprovider
      # FalkorDBConfig reads its host and port from these, set for this step only.
      - name: Integration tests (live FalkorDB)
        run: python -m pytest tests/ -q -p no:cacheprovider -m integration
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: '6390'

  data:
    name: Data backup and restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      # The roundtrip starts a throwaway stack from infra/compose.yml.
      - run: python -m pytest scripts/datakit/tests -q
        env:
          DATAKIT_DOCKER_TESTS: '1'

  tooling:
    name: Repository tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # A directory argument fails on Node 26: the glob names the test files.
      - run: node --test '.claude/hooks/*.test.mjs'
      - run: sh scripts/ci/tests/test_checks.sh
      - run: sh scripts/tests/test_release_notes.sh

  deploy:
    name: Production deploy scripts and stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # start.sh and scripts/prod against a stub docker; /bin/sh is dash here, as on the host.
      - run: sh scripts/prod/tests/test_deploy.sh
      # The Compose files rendered and checked for what the design promises (no container runs).
      - run: sh scripts/prod/tests/test_compose.sh
      # The ingress: its routes against the web app's proxy list, then the real Caddyfile in
      # front of stand-in upstreams (the login gate, the OAuth routes, the forwarded address).
      - run: node --test infra/ingress/paths.test.mjs
      - run: sh infra/ingress/checks/gate.sh

  release-source:
    name: Release source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Through env, never inline: a branch name is attacker-controlled text.
      - run: sh scripts/ci/check_release_source.sh "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}

  main-in-develop:
    name: main inside develop
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.base_ref == 'develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sh scripts/ci/check_main_in_develop.sh origin/main HEAD
