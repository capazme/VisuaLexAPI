name: Security Audit

# Python deps have lower bounds only, so a clean resolution can turn
# vulnerable with no change here: hence the weekly schedule.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          inputs: services/visualex/requirements.txt

  # What ships blocks; development tools are shown and never block (G-552). The runtime images
  # install with `npm ci --omit=dev` and the web ships as built files. Two exceptions run on the
  # deployment host all the same: the Prisma CLI (a development dependency), which the one-shot
  # `migrate` container runs from the build stage against the database, and the web's build tools,
  # on our own sources. The cost: a future high advisory in a development tool, these included, no
  # longer blocks.
  npm-audit:
    name: npm audit, production dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [apps/web, apps/server, apps/mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.workspace }}

  npm-audit-dev:
    name: npm audit, development tools included (shown, never blocks)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [apps/web, apps/server, apps/mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # A finding becomes a warning on the run's summary page; the job itself stays green.
      - run: |
          if ! npm audit --audit-level=high; then
            echo "::warning title=npm audit (${{ matrix.workspace }})::a high or critical advisory; this check never blocks, the production one does (G-552)"
          fi
        working-directory: ${{ matrix.workspace }}
