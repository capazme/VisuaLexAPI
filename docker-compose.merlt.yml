# MERL-T sidecar — dipendenze per VisuaLex Slice 1
#
# Servizi:
#   merlt-postgres   — Postgres dedicato a MERL-T (QA traces, RLCF, pending entities)
#   merlt-redis      — Redis cache MERL-T
#   merlt-falkordb   — Knowledge graph giuridico
#   merlt-qdrant     — Vector store (embeddings)
#   merlt-api        — FastAPI (profile opzionale 'api-in-docker';
#                     default è gestito da start.sh con uvicorn locale per hot reload)
#
# Avvio default (dev, hot reload):
#   docker compose -f docker-compose.merlt.yml up -d
#   → avvia 4 dipendenze; merlt-api parte via start.sh con uvicorn locale
#
# Avvio production-like (API in container):
#   docker compose -f docker-compose.merlt.yml --profile api-in-docker up -d
#   → avvia tutti i 5 servizi
#
# Env vars cambiabili: vedi backend/.env.example sezione MERLT_*

services:
  merlt-postgres:
    image: postgres:16-alpine
    container_name: visualex-merlt-postgres
    environment:
      POSTGRES_DB: ${MERLT_POSTGRES_DB:-merlt}
      POSTGRES_USER: ${MERLT_POSTGRES_USER:-merlt}
      POSTGRES_PASSWORD: ${MERLT_POSTGRES_PASSWORD:-merlt}
    ports:
      - "${MERLT_POSTGRES_PORT:-5436}:5432"
    volumes:
      - merlt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MERLT_POSTGRES_USER:-merlt} -d ${MERLT_POSTGRES_DB:-merlt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  merlt-redis:
    image: redis:7-alpine
    container_name: visualex-merlt-redis
    ports:
      - "${MERLT_REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  merlt-falkordb:
    image: falkordb/falkordb:latest
    container_name: visualex-merlt-falkordb
    # Auto-recover from a crash (it segfaulted (exit 139) once under heavy load
    # and did NOT restart on its own). Data lives on the merlt_falkor_data volume,
    # so a restart reloads the 27.7k-node graph intact.
    restart: unless-stopped
    ports:
      - "${MERLT_FALKOR_PORT:-6382}:6379"
    volumes:
      - merlt_falkor_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  merlt-qdrant:
    image: qdrant/qdrant:latest
    container_name: visualex-merlt-qdrant
    ports:
      - "${MERLT_QDRANT_PORT:-6343}:6333"
      - "${MERLT_QDRANT_GRPC_PORT:-6344}:6334"
    volumes:
      - merlt_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Loop β (A.1) — mcp-legal-it as an HTTP MCP sidecar. Vendored as a git
  # submodule at vendor/mcp-legal-it. The upstream Dockerfile defaults to
  # MCP_PORT=8000, which collides with merlt-api → override to 8011 here.
  # The FastMCP server serves Streamable HTTP at the MCP_PATH (/mcp).
  mcp-legal-it:
    build:
      context: ./vendor/mcp-legal-it
      dockerfile: Dockerfile
    container_name: visualex-mcp-legal-it
    profiles: ["api-in-docker"]
    environment:
      MCP_TRANSPORT: "http"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8011"
      MCP_PATH: "/mcp"
      LEGAL_PROFILE: "full"
    ports:
      - "${MCP_LEGAL_IT_PORT:-8011}:8011"
    healthcheck:
      # The mcp-legal-it image (python:3.12-slim) has NO curl, and /mcp needs the MCP
      # Accept/session handshake for a 200 (a bare GET is 4xx). Use a python TCP-connect
      # probe: port 8011 open ⇒ the FastMCP HTTP server is up and routing. python3 is
      # always present in the image.
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost',8011),2).close()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  merlt-api:
    build:
      context: ./merlt
      dockerfile: Dockerfile
    container_name: visualex-merlt-api
    profiles: ["api-in-docker"]
    depends_on:
      merlt-postgres:
        condition: service_healthy
      merlt-redis:
        condition: service_healthy
      merlt-falkordb:
        condition: service_healthy
      merlt-qdrant:
        condition: service_healthy
      mcp-legal-it:
        condition: service_started
    environment:
      # Postgres — generic DATABASE_URL + dedicated RLCF/ENRICHMENT vars
      # MERL-T code reads ENRICHMENT_DB_* and RLCF_DATABASE_URL explicitly
      # (defaults are localhost:5433/rlcf_dev which fail inside container network).
      DATABASE_URL: "postgresql://${MERLT_POSTGRES_USER:-merlt}:${MERLT_POSTGRES_PASSWORD:-merlt}@merlt-postgres:5432/${MERLT_POSTGRES_DB:-merlt}"
      ENRICHMENT_DATABASE_URL: "postgresql+asyncpg://${MERLT_POSTGRES_USER:-merlt}:${MERLT_POSTGRES_PASSWORD:-merlt}@merlt-postgres:5432/${MERLT_POSTGRES_DB:-merlt}"
      ENRICHMENT_DB_HOST: "merlt-postgres"
      ENRICHMENT_DB_PORT: "5432"
      ENRICHMENT_DB_NAME: "${MERLT_POSTGRES_DB:-merlt}"
      ENRICHMENT_DB_USER: "${MERLT_POSTGRES_USER:-merlt}"
      ENRICHMENT_DB_PASSWORD: "${MERLT_POSTGRES_PASSWORD:-merlt}"
      RLCF_DATABASE_URL: "postgresql://${MERLT_POSTGRES_USER:-merlt}:${MERLT_POSTGRES_PASSWORD:-merlt}@merlt-postgres:5432/${MERLT_POSTGRES_DB:-merlt}"
      RLCF_ASYNC_DATABASE_URL: "postgresql+asyncpg://${MERLT_POSTGRES_USER:-merlt}:${MERLT_POSTGRES_PASSWORD:-merlt}@merlt-postgres:5432/${MERLT_POSTGRES_DB:-merlt}"

      # Redis
      REDIS_URL: "redis://merlt-redis:6379/0"
      REDIS_HOST: "merlt-redis"
      REDIS_PORT: "6379"
      # RQ job queue (DB 1) — the api ENQUEUES extraction/ingestion jobs, so it
      # needs the queue Redis too (not just the worker). Without this the api
      # defaults to localhost:6379 and enqueue fails inside the container.
      RQ_REDIS_URL: "redis://merlt-redis:6379/1"

      # FalkorDB
      FALKORDB_HOST: "merlt-falkordb"
      FALKORDB_PORT: "6379"

      # VisuaLex Python API on the HOST (worker scrapes Normattiva through it).
      # `host.docker.internal` is the host loopback gateway from inside the
      # container; the Python API listens on 5000 (NOT the legacy 5100 default
      # baked into `visualex_client.VISUALEX_API_URL`). Without this override
      # the worker hits the container's own 5100 → ConnectionError → silent
      # 0-nodes "success".
      VISUALEX_API_URL: "http://host.docker.internal:5000"

      # Qdrant
      QDRANT_HOST: "merlt-qdrant"
      QDRANT_PORT: "6333"

      # Loop β (A.1/A.2) — mcp-legal-it HTTP MCP endpoint. The experts reach it
      # through McpLegalToolAdapter (FastMCP client). Service-name DNS on the
      # compose network; the Streamable HTTP transport is served at /mcp.
      MCP_LEGAL_IT_URL: "http://mcp-legal-it:8011/mcp"

      # Slice 2a — Seed loader (Libro IV CC). MERLT_DATA_DIR points at the
      # mounted data/ directory; MERLT_SKIP_SEED=true disables boot loading.
      # MERLT_SKIP_EMBEDDINGS=true (DEFAULT) skips the slow embedding step:
      # e5-large on docker CPU over M-series virtualization runs ~2s/text, so
      # the full set (17k texts) takes 8+ hours. Embeddings should be generated
      # separately via `python -m merlt.scripts.load_seed_libro_iv` on the host
      # (PyTorch ARM native is ~10x faster).
      MERLT_DATA_DIR: "/app/data"
      MERLT_SKIP_SEED: "${MERLT_SKIP_SEED:-false}"
      MERLT_SKIP_EMBEDDINGS: "${MERLT_SKIP_EMBEDDINGS:-true}"
      FALKORDB_GRAPH_NAME: "${MERLT_GRAPH_NAME:-merl_t_legal}"
      # LLM (OpenRouter) — required for live entity extraction from user notes.
      # Set OPENROUTER_API_KEY in the repo-root .env or your shell before `up`.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    volumes:
      # Seeds + dumps for the Slice 2a boot loader. Read-only, host filesystem.
      - ./merlt/data:/app/data:ro
      # Shared uploads dir: the api receives the file, the worker reads it for
      # extraction (Slice 2c) — must be the same volume across both services.
      - merlt_uploads:/app/uploads
      # Loop β prereq (0.0): persist the HuggingFace cache (e5-large, ~1.2GB) so
      # rebuilds/recreates don't re-download it and re-pay the ~86s cold load.
      # Container runs as `appuser` → cache lives at /home/appuser/.cache/huggingface.
      - merlt_hf_cache:/home/appuser/.cache/huggingface
    ports:
      - "${MERLT_API_PORT:-8000}:8000"
    command: ["uvicorn", "merlt.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s

  merlt-worker:
    build:
      context: ./merlt
      dockerfile: Dockerfile
    container_name: visualex-merlt-worker
    profiles: ["api-in-docker"]
    depends_on:
      merlt-postgres:
        condition: service_healthy
      merlt-redis:
        condition: service_healthy
      merlt-falkordb:
        condition: service_healthy
      merlt-qdrant:
        condition: service_healthy
    environment:
      # Same DB/cache wiring as merlt-api so the worker reaches the same backends.
      DATABASE_URL: "postgresql://${MERLT_POSTGRES_USER:-merlt}:${MERLT_POSTGRES_PASSWORD:-merlt}@merlt-postgres:5432/${MERLT_POSTGRES_DB:-merlt}"
      ENRICHMENT_DATABASE_URL: "postgresql+asyncpg://${MERLT_POSTGRES_USER:-merlt}:${MERLT_POSTGRES_PASSWORD:-merlt}@merlt-postgres:5432/${MERLT_POSTGRES_DB:-merlt}"
      ENRICHMENT_DB_HOST: "merlt-postgres"
      ENRICHMENT_DB_PORT: "5432"
      ENRICHMENT_DB_NAME: "${MERLT_POSTGRES_DB:-merlt}"
      ENRICHMENT_DB_USER: "${MERLT_POSTGRES_USER:-merlt}"
      ENRICHMENT_DB_PASSWORD: "${MERLT_POSTGRES_PASSWORD:-merlt}"
      RLCF_DATABASE_URL: "postgresql://${MERLT_POSTGRES_USER:-merlt}:${MERLT_POSTGRES_PASSWORD:-merlt}@merlt-postgres:5432/${MERLT_POSTGRES_DB:-merlt}"
      RLCF_ASYNC_DATABASE_URL: "postgresql+asyncpg://${MERLT_POSTGRES_USER:-merlt}:${MERLT_POSTGRES_PASSWORD:-merlt}@merlt-postgres:5432/${MERLT_POSTGRES_DB:-merlt}"

      # Redis (general cache)
      REDIS_URL: "redis://merlt-redis:6379/0"
      REDIS_HOST: "merlt-redis"
      REDIS_PORT: "6379"

      # FalkorDB
      FALKORDB_HOST: "merlt-falkordb"
      FALKORDB_PORT: "6379"

      # VisuaLex Python API on the HOST (worker scrapes Normattiva through it).
      # `host.docker.internal` is the host loopback gateway from inside the
      # container; the Python API listens on 5000 (NOT the legacy 5100 default
      # baked into `visualex_client.VISUALEX_API_URL`). Without this override
      # the worker hits the container's own 5100 → ConnectionError → silent
      # 0-nodes "success".
      VISUALEX_API_URL: "http://host.docker.internal:5000"
      FALKORDB_GRAPH_NAME: "${MERLT_GRAPH_NAME:-merl_t_legal}"

      # Qdrant
      QDRANT_HOST: "merlt-qdrant"
      QDRANT_PORT: "6333"

      # RQ job queue (Redis DB 1, separate from the general cache DB 0).
      RQ_REDIS_URL: "redis://merlt-redis:6379/1"

      # BFF callback for job status (MerltIngestionJob). host.docker.internal lets
      # the container reach the Node BFF running on the host.
      BFF_CALLBACK_URL: "${MERLT_BFF_CALLBACK_URL:-http://host.docker.internal:3001/api/merlt/internal/job-callback}"
      # Slice 2c: separate callback for document-extraction jobs (MerltExtractionJob).
      BFF_EXTRACTION_CALLBACK_URL: "${MERLT_BFF_EXTRACTION_CALLBACK_URL:-http://host.docker.internal:3001/api/merlt/internal/extraction-callback}"
      MERLT_INTERNAL_SECRET: "${MERLT_INTERNAL_SECRET:-dev-internal-secret}"
      # LLM (OpenRouter) — the worker runs the extraction, so it needs the key.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"

      # The worker must NOT run the seed loader — only the api seeds at boot.
      MERLT_SKIP_SEED: "true"
      MERLT_DATA_DIR: "/app/data"
    volumes:
      # Parity with merlt-api; ingest scrapes live but keep the data mount available.
      - ./merlt/data:/app/data:ro
      # Shared uploads dir: the api receives the file, the worker reads it for
      # extraction (Slice 2c) — must be the same volume across both services.
      - merlt_uploads:/app/uploads
      # Loop β prereq (0.0): share the same HF cache as merlt-api — the worker
      # embeds chunks during ingestion, so it needs the e5-large weights too.
      - merlt_hf_cache:/home/appuser/.cache/huggingface
    # Slice 2c: also consume the merlt_extract queue (extract_to_staging task).
    command: ["rq", "worker", "merlt_ingest", "merlt_extract", "--url", "redis://merlt-redis:6379/1"]
    # Override the API image's HTTP healthcheck (curl :8000) — the worker is not
    # an HTTP server. Liveness here = it can reach its RQ Redis (DB 1).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,redis; redis.from_url(os.environ['RQ_REDIS_URL']).ping()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  merlt_postgres_data:
  merlt_falkor_data:
  merlt_qdrant_data:
  merlt_uploads:
  merlt_hf_cache:
